<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Taktiktavla</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="toolbar" aria-label="Verktyg">
        <button id="addRed" class="btn red-btn" type="button">Röd</button>
        <button id="addBlue" class="btn blue-btn" type="button">Blå</button>
        <button id="addYellow" class="btn yellow-btn" type="button">Gul MV</button>
        <button id="addRedSub" class="btn red-sub-btn" type="button">Röd avb</button>
        <button id="addBlueSub" class="btn blue-sub-btn" type="button">Blå avb</button>
        <button id="toggleField" class="btn" type="button">Halvplan</button>
        <button id="toggleLock" class="btn" type="button">Lås</button>
        <button id="exportImage" class="btn" type="button">Exportera bild</button>
        <button id="saveBoard" class="btn" type="button">Spara</button>
        <button id="clearBoard" class="btn danger" type="button">Rensa</button>
      </div>
      <p id="saveStatus" class="save-status">Redo</p>
    </header>

    <main class="main">
      <section class="canvas-shell" aria-label="Taktiktavla">
        <div id="canvas" class="canvas">
          <div class="board-frame">
            <div id="board" class="board"></div>
          </div>

          <div class="bench-area" aria-label="Avbytare">
            <div class="bench-title">Avbytare</div>
            <div class="bench-row-line"></div>
          </div>

          <div id="magnetsLayer" class="magnets-layer"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="magnetModal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Ny magnet</h2>
        <button id="closeModal" class="modal-close" type="button" aria-label="Stäng">×</button>
      </div>
      <form id="magnetForm" class="modal-form">
        <div class="chip-preview-wrap">
          <div id="typePreview" class="type-preview">Röd</div>
        </div>
        <label>
          <span>Namn</span>
          <input id="nameInput" name="name" type="text" autocomplete="off" required maxlength="24">
        </label>
        <label>
          <span>Nummer eller text i magneten</span>
          <input id="markerInput" name="marker" type="text" autocomplete="off" maxlength="4" placeholder="Valfritt">
        </label>
        <div class="modal-actions">
          <button id="cancelModal" class="btn" type="button">Avbryt</button>
          <button class="btn primary-btn" type="submit">Spara magnet</button>
        </div>
      </form>
    </div>
  </div>

  <div id="startModal" class="modal start-modal" aria-hidden="false">
    <div class="modal-backdrop"></div>
    <div class="start-card" role="dialog" aria-modal="true" aria-labelledby="startTitle">
      <h2 id="startTitle">Taktiktavla</h2>
      <p>Välj hur du vill börja.</p>
      <div class="start-actions">
        <button id="newBoardBtn" class="btn primary-btn" type="button">Ny tavla</button>
        <button id="continueBoardBtn" class="btn" type="button">Fortsätt senaste</button>
      </div>
      <p id="continueHint" class="continue-hint"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
